apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: coalesces.coalesce.flatheadmill.com
spec:
  group: coalesce.flatheadmill.com
  names:
    kind: Coalesce
    listKind: CoalesceList
    plural: coalesces
    singular: coalesce
    shortNames: [coal]
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [files]
            properties:
              configMapMetadata:
                type: object
                description: Labels and annotations for the generated ConfigMap, separate from this resource's deployment metadata.
                properties:
                  labels:
                    type: object
                    additionalProperties:
                      type: string
                  annotations:
                    type: object
                    description: coalesce.flatheadmill.com/rendered-generation is reserved for the operator.
                    additionalProperties:
                      type: string
              template:
                type: object
                nullable: true
                x-kubernetes-preserve-unknown-fields: true
                description: Opaque PodTemplateSpec passed to the receiver. Absent or null produces a library.
              files:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [path]
                items:
                  type: object
                  required: [path, body]
                  properties:
                    path:
                      type: string
                      minLength: 1
                      description: Clean relative USTAR file path. Ancestor collisions and unrepresentable paths are rejected by the operator.
                    executable:
                      type: boolean
                      default: false
                      description: Selects mode 0755 instead of 0644.
                    body:
                      type: string
                      description: Complete UTF-8 file content, including any final newline.
    additionalPrinterColumns:
    - name: Generation
      type: integer
      jsonPath: .metadata.generation
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
