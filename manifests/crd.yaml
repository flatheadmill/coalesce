apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: coalesces.coalesce.io
spec:
  group: coalesce.io
  names:
    kind: Coalesce
    listKind: CoalesceList
    plural: coalesces
    singular: coalesce
    shortNames:
    - coal
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              source:
                type: string
                description: "Zsh source code defining the pipeline DAG"
              timeout:
                type: integer
                description: "Timeout in seconds for the entire pipeline"
                default: 3600
              resources:
                type: object
                description: "Resource requirements for the orchestrator Job"
                properties:
                  requests:
                    type: object
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                  limits:
                    type: object
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
            required:
            - source
    additionalPrinterColumns:
    - name: Timeout
      type: integer
      jsonPath: .spec.timeout
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp