# A portable pipeline. Its label and repository claim belong to the generated
# ConfigMap; this resource's outer metadata belongs to its deployment tool.
apiVersion: coalesce.flatheadmill.com/v1alpha1
kind: Coalesce
metadata:
  name: example
  namespace: coalesce
spec:
  configMapMetadata:
    labels:
      coalesce.flatheadmill.com/pipeline: ""
    annotations:
      coalesce.flatheadmill.com/repository: amalgamated-widgets/example
      coalesce.flatheadmill.com/events: pull_request.opened
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: pipeline
        image: busybox:1.37
        command: [sh, -c]
        args:
        - |
          mkdir -p /tmp/source
          tar -xzf /source/ball.tar.gz -C /tmp/source
          exec /tmp/source/run
        volumeMounts:
        - name: source
          mountPath: /source
          readOnly: true
      volumes:
      - name: source
        configMap:
          name: example
  files:
  - path: run
    executable: true
    body: |
      #!/bin/sh
      printf '%s\n' 'hello from readable Coalesce source'
