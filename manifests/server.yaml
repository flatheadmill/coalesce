# The Go server runs in-cluster as a first-class Kubernetes citizen. It uses
# the ServiceAccount's token for API access — no kubeconfig, no fallback.
# PostgreSQL remains external, reachable from pods via host.orb.internal.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coalesce-web
  namespace: default
---
# Pod log access for live tailing. The server watches pods by label selector
# and streams logs via the Kubernetes API. These permissions are the minimum
# needed: find pods, watch their status, read their logs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coalesce-web
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coalesce-web
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coalesce-web
subjects:
- kind: ServiceAccount
  name: coalesce-web
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coalesce-web
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coalesce-web
  template:
    metadata:
      labels:
        app: coalesce-web
    spec:
      serviceAccountName: coalesce-web
      containers:
      - name: coalesce-web
        image: coalesce-web
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: host.orb.internal
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: coalesce-web
  namespace: default
spec:
  selector:
    app: coalesce-web
  ports:
  - port: 80
    targetPort: 8080
