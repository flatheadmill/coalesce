# Readable equivalent of test/library/ for the operator proof.
# coalesce.yaml is an explicit file here to preserve the old extracted tree.
apiVersion: coalesce.flatheadmill.com/v1alpha1
kind: Coalesce
metadata:
  name: library
  namespace: coalesce
spec:
  files:
  - path: "coalesce.yaml"
    executable: false
    body: |
      # A library is the typed document with metadata only: no spec.template, so
      # the renderer emits no template.yaml and the receiver never claims it. It is
      # a mount for pipelines that name it, nothing more.
      apiVersion: coalesce.flatheadmill.com/v1alpha1
      kind: Coalesce
      metadata:
        name: library
        namespace: coalesce
  - path: "say_hello.zsh"
    executable: false
    body: |
      # The little brute of a module system: this file rides in the library
      # ConfigMap, the layout script untars it to src/library, and a pipeline that
      # named library in its sources gets this function for the price of a source
      # statement. No autoload, no fpath, no registry — a Job has no keystroke to
      # make laziness worth anything.

      function say_hello_world {
          print 'hello, world'
      }
